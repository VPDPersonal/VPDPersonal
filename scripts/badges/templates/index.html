<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Aspid README media</title>
  <style>
    :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
    body { max-width: 760px; margin: 48px auto; padding: 0 20px; background: #fff; color: #222925; }
    h1 { font-size: 28px; margin-bottom: 12px; }
    h2 { font-size: 20px; }
    h3 { font-size: 13px; font-weight: 500; margin: 0; min-width: 64px; }
    p { line-height: 1.6; }
    a { color: inherit; }
    article { padding: 12px 0 24px; border-bottom: 1px solid #cfd5cf; }
    article h2 a { text-decoration: none; }
    .channel, .badges { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
    .channel { margin-top: 14px; }
    .badges img { display: block; height: 32px; }
    .banner { display: block; margin: 20px 0; }
    .banner img { display: block; width: 100%; height: auto; border-radius: 8px; }
    footer { margin-top: 28px; }
    @media (prefers-color-scheme: dark) {
      body { background: #151915; color: #e5e9e5; }
      article { border-color: #363d38; }
    }
  </style>
</head>
<body>
  <h1>Aspid README media</h1>
  <p>Shared banners and badges for Aspid packages. Open an image to copy its permanent URL.</p>
  <main>{{projects}}</main>
  <footer><a href="badges/status-badge-license.svg"><img src="badges/status-badge-license.svg" alt="MIT License" height="32"></a></footer>
</body>
</html>
