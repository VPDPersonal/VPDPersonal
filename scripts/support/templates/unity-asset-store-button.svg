<svg id="stacked" xmlns="http://www.w3.org/2000/svg" width="100%" height="48">
  <title>Unity Asset Store</title>
  <style>
    .bg{x:4px;width:calc(100% - 5px);fill:#10121a;stroke:#1d8840;stroke-width:2}
    :target .bg{x:1px;width:calc(100% - 2px)}
    .ink{fill:#f0f0f2}
    @media(prefers-color-scheme:dark){.bg{stroke:#5cb46b}}
  </style>
  <rect class="bg" y="1" height="46" rx="8"/>
  <svg x="50%" width="1" height="48" overflow="visible">
    <image x="-70" y="12" width="22" height="24" href="{{icon}}"/>
    <text class="ink" x="-43" y="29" font-family="Arial, sans-serif" font-size="14" font-weight="700">Unity Asset Store</text>
  </svg>
</svg>
