<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aspid Package Manager walkthrough</title>
  <style>
    @font-face { font-family: Plex Mono; font-style: normal; font-weight: 400; src: url('fonts/plex-mono-latin-400.woff2') format('woff2'); }
    @font-face { font-family: Plex Sans; font-style: normal; font-weight: 400; src: url('fonts/plex-sans-latin-400.woff2') format('woff2'); }
    * { box-sizing: border-box; }
    body { margin: 0; overflow: hidden; background: #383838; }
    .pm { position: relative; display: flex; flex-direction: column; width: 448px; height: 230px; transform: scale(2); transform-origin: top left; color: #d2d2d2; background: #383838; font: 11.5px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif; }
    .pmTitle { display: flex; background: #282828; border-bottom: 1px solid #1f1f1f; }
    .pmTitle span { margin-bottom: -1px; padding: 6px 12px; background: #383838; border-right: 1px solid #1f1f1f; font-weight: 600; }
    .pmToolbar { display: flex; align-items: center; gap: 10px; padding: 5px 8px; background: #3c3c3c; border-bottom: 1px solid #242424; }
    .pmPlus { padding: 1px 7px; background: #585858; border: 1px solid #2a2a2a; border-radius: 3px; }
    .pmPlus[data-press] { background: #4a6f9a; }
    .pmFilter { color: #b8b8b8; }
    .pmMain { display: grid; flex: 1; grid-template-columns: 44% 1fr; min-height: 0; }
    .pmList { margin: 0; padding: 0; background: #333; border-right: 1px solid #242424; list-style: none; }
    .pmList li { display: flex; justify-content: space-between; gap: 6px; margin: 0; padding: 5px 8px; border-bottom: 1px solid #2c2c2c; white-space: nowrap; }
    .pmList li + li { margin-top: 4px; }
    .pmList li span:last-child { color: #9a9a9a; }
    .pmList li span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    .pmNew { max-height: calc(30px * var(--added)); padding-block: calc(5px * var(--added)) !important; overflow: hidden; background: #2c5d87; opacity: var(--added); }
    .pmNew span:last-child { color: #d6e6f5 !important; }
    .pmDetail { display: flex; flex-direction: column; gap: 7px; padding: 10px 12px; }
    .pmDetail strong { color: #eee; font-size: 14px; }
    .pmId { color: #9a9a9a; font-family: Plex Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10.5px; }
    .pmBadge { align-self: flex-start; padding: 2px 7px; color: #bfe5c5; background: rgb(92 180 107 / .18); border: 1px solid rgb(92 180 107 / .45); border-radius: 4px; }
    .pmSkeleton { height: 8px; background: #444; border-radius: 4px; }
    .pmMenu { position: absolute; top: 52px; left: 8px; margin: 0; padding: 3px 0; background: #2f2f2f; border: 1px solid #1c1c1c; border-radius: 4px; box-shadow: 0 6px 18px rgb(0 0 0 / .45); list-style: none; }
    .pmMenu li { margin: 0; padding: 3px 14px; white-space: nowrap; }
    .pmMenu li[data-hover] { color: #fff; background: #3a79bb; }
    .pmPopover { position: absolute; top: 52px; left: 8px; right: 8px; display: flex; flex-wrap: wrap; gap: 6px; padding: 7px; background: #2f2f2f; border: 1px solid #1c1c1c; border-radius: 4px; box-shadow: 0 6px 18px rgb(0 0 0 / .45); }
    .pmInput { display: flex; flex: 1; align-items: center; min-width: 0; overflow: hidden; padding: 2px 6px; background: #1f1f1f; border: 1px solid #3a79bb; border-radius: 3px; }
    .pmTyped { flex: none; color: #e6e6e6; font: 400 11.5px/1 Plex Sans, sans-serif; white-space: nowrap; }
    .pmInstall { padding: 2px 10px; background: #585858; border: 1px solid #2a2a2a; border-radius: 3px; }
    .pmInstall[data-press] { background: #4a6f9a; }
    .pmProgress { flex-basis: 100%; height: 2px; background: #3a79bb; transform-origin: left; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="pm" id="window" role="img" aria-label="Installing an Aspid package in Unity Package Manager">
    <div class="pmTitle"><span>Package Manager</span></div>
    <div class="pmToolbar"><span class="pmPlus" id="plus">+ ▾</span><span class="pmFilter">Packages: In Project ▾</span></div>
    <div class="pmMain">
      <ul class="pmList">
        <li><span>Input System</span><span>1.11.2</span></li>
        <li><span>Universal RP</span><span>17.0.3</span></li>
        <li class="pmNew" id="added"><span id="list-name"></span><span id="version"></span></li>
      </ul>
      <div class="pmDetail">
        <div id="skeleton"><div class="pmSkeleton" style="width:62%;margin-bottom:7px"></div><div class="pmSkeleton" style="width:40%;margin-bottom:7px"></div><div class="pmSkeleton" style="width:78%"></div></div>
        <strong id="name" hidden></strong><span class="pmId" id="package-id" hidden></span><span class="pmBadge" id="installed" hidden>✓ Installed from Git</span>
      </div>
    </div>
    <ul class="pmMenu" id="menu" hidden>
      <li>Install package from disk…</li><li>Install package from tarball…</li><li id="git-item">Install package from git URL…</li><li>Install package by name…</li>
    </ul>
    <div class="pmPopover" id="popover" hidden>
      <span class="pmInput" id="input"><span class="pmTyped" id="typed"></span></span><span class="pmInstall" id="install">Install</span><span class="pmProgress" id="progress"></span>
    </div>
  </div>
  <script src="scene.js"></script>
</body>
</html>
