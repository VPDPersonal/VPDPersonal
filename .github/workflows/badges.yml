name: Shared Aspid README media

on:
  pull_request:
    paths: ['scripts/**', 'package.json', 'package-lock.json', '.github/workflows/badges.yml']
  push:
    branches: [main]
    paths: ['scripts/**', 'package.json', 'package-lock.json', '.github/workflows/badges.yml']
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aspid-badges-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Read published package data
        id: sources
        run: node scripts/build-site.mjs --prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Restore rendered banners
        id: banners
        uses: actions/cache@v4
        with:
          path: .artifacts/banner-cache
          key: ${{ runner.os }}-aspid-banners-v2-${{ steps.sources.outputs.banners-digest }}
      - name: Restore installation walkthroughs
        uses: actions/cache@v4
        with:
          path: .artifacts/installation-cache
          key: ${{ runner.os }}-aspid-installation-v1-${{ steps.sources.outputs.installation-digest }}
      - name: Validate media caches
        id: media
        run: node scripts/build-site.mjs --cache-status
      - name: Install media renderer
        if: steps.media.outputs.needs-renderer == 'true' || github.event_name == 'pull_request'
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y webp
      - run: npm test
      - name: Check README media in browser
        if: steps.media.outputs.needs-renderer == 'true' || github.event_name == 'pull_request'
        run: npm run test:media-browser
      - name: Build shared README media
        run: npm run build
        env:
          ASPID_README_SOURCES: .artifacts/published-projects.json
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: .artifacts/readme-site
          retention-days: 1

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy README media
        id: deployment
        uses: actions/deploy-pages@v4
